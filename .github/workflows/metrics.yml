name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - uses: actions/checkout@v4

      - name: Make it purple
        run: |
          perl -0pi -e 's#</svg>(?!.*</svg>)#<style>:root{filter:invert(1) hue-rotate(310deg)}</style></svg>#s' metrics.plugin.isocalendar.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.isocalendar.svg
          git commit -m "purple isocalendar" || echo "nothing to commit"
          git push
