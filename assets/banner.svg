<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'Fira Code','Consolas','Courier New',monospace}
    .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .ln{opacity:0;animation:fi .7s ease forwards}
    @keyframes fi{to{opacity:1}}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>

  <!-- prompt -->
  <text class="mono ln" x="40" y="34" font-size="13" font-weight="600" style="animation-delay:.1s">
    <tspan fill="#f0abfc">$</tspan><tspan fill="#d8b4fe"> whoami</tspan>
  </text>
  <rect class="cur" x="118" y="23" width="8" height="14" fill="#f0abfc"/>

  <!-- name -->
  <text class="sans ln" x="40" y="102" font-size="58" font-weight="800" fill="#f5f3ff" style="animation-delay:.3s">Maira Domaog</text>
  <rect class="ln" x="40" y="114" width="140" height="4" rx="2" fill="url(#ul)" style="animation-delay:.6s"/>

  <!-- role -->
  <text class="sans ln" x="40" y="150" font-size="20" fill="#ddd6fe" style="animation-delay:.9s">BS Information Technology Student</text>
  <text class="mono ln" x="40" y="176" font-size="12" fill="#a78bfa" style="animation-delay:1.2s">network / iot  •  web dev  •  always learning</text>

  <!-- big faded code icon -->
  <g fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".28">
    <polyline points="700,55 650,100 700,145"/>
    <line x1="775" y1="45" x2="745" y2="155"/>
    <polyline points="800,55 850,100 800,145"/>
  </g>
</svg>
