<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="h" d="M0,4.6 C-7.4,-1 -4.2,-6.8 0,-2.9 C4.2,-6.8 7.4,-1 0,4.6 Z"/>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#5b3a9e"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a855f7" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect x="10" y="10" width="880" height="280" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Fira Code','Consolas','Courier New',monospace}
    .k{fill:#a78bfa;font-size:13px}
    .c{fill:#6d4fc2;font-size:13px}
    .v{fill:#ede9fe;font-size:13px}
    .ln{opacity:0;animation:fi .6s ease forwards}
    @keyframes fi{to{opacity:1}}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>

  <!-- card -->
  <rect x="10" y="10" width="880" height="280" rx="14" fill="#140d2b"/>
  <g clip-path="url(#card)">
    <rect x="10" y="10" width="880" height="280" fill="url(#grid)"/>
    <rect x="10" y="10" width="880" height="36" fill="#1b1338"/>
    <rect x="10" y="46" width="880" height="1" fill="#7c3aed" opacity=".4"/>
  </g>
  <rect x="10" y="10" width="880" height="280" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity=".8"/>

  <!-- window dots + title -->
  <circle cx="34" cy="28" r="5" fill="#f0abfc"/>
  <circle cx="54" cy="28" r="5" fill="#c084fc"/>
  <circle cx="74" cy="28" r="5" fill="#7c3aed"/>
  <text class="mono" x="450" y="32" text-anchor="middle" font-size="12" fill="#8b6fd1">~/about-maira.sh</text>

  <!-- prompt -->
  <text class="mono ln" x="30" y="78" font-size="13" font-weight="600" style="animation-delay:.2s">
    <tspan fill="#f0abfc">$</tspan><tspan fill="#d8b4fe"> whoami</tspan>
  </text>

  <!-- info -->
  <g class="mono">
    <text class="ln" x="40" y="114" style="animation-delay:.6s"><tspan class="k">name</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">Maira Lorraine Domaog</tspan></text>
    <text class="ln" x="40" y="140" style="animation-delay:.9s"><tspan class="k">role</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">3rd-year BSIT student</tspan></text>
    <text class="ln" x="40" y="166" style="animation-delay:1.2s"><tspan class="k">track</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">Network / IoT</tspan></text>
    <text class="ln" x="40" y="192" style="animation-delay:1.5s"><tspan class="k">location</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">Cagayan de Oro, Philippines</tspan></text>
    <text class="ln" x="40" y="218" style="animation-delay:1.8s"><tspan class="k">currently</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">learning CCNA + building small projects</tspan></text>
    <text class="ln" x="40" y="244" style="animation-delay:2.1s"><tspan class="k">status</tspan><tspan class="c" x="150">:</tspan><tspan class="v" x="170">developer in progress</tspan></text>
  </g>

  <!-- last prompt -->
  <text class="mono ln" x="30" y="274" font-size="13" font-weight="600" style="animation-delay:2.5s">
    <tspan fill="#f0abfc">$</tspan>
  </text>
  <rect class="cur" x="46" y="263" width="8" height="14" fill="#f0abfc"/>

  <!-- single soft heart -->
  <g transform="translate(780,165) scale(7)" fill="#f0abfc" opacity=".85"><use href="#h"/></g>

  <!-- ribbon -->
  <g transform="translate(872,14) rotate(25) scale(0.9)" fill="#f9a8d4" stroke="#f0abfc" stroke-width="1" stroke-linejoin="round">
    <path d="M-1,2 L-7,15 L-2,12 L0,16 Z"/>
    <path d="M1,2 L7,15 L2,12 L0,16 Z"/>
    <path d="M0,0 C-6,-10 -19,-9 -17,0 C-19,9 -6,10 0,0 Z"/>
    <path d="M0,0 C6,-10 19,-9 17,0 C19,9 6,10 0,0 Z"/>
    <circle r="3.4" fill="#f0abfc"/>
  </g>
</svg>
